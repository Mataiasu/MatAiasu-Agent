name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build Agent
        run: pyinstaller --noconfirm --clean --onefile --name MatAiasu-Agent --hidden-import agent.updater agent/cli.py

      - name: Build Updater
        run: pyinstaller --noconfirm --clean --onefile --name MatAiasu-Agent-Updater agent/updater.py

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MatAiasu-Agent.exe release/MatAiasu-Agent.exe
          Copy-Item dist/MatAiasu-Agent-Updater.exe release/MatAiasu-Agent-Updater.exe
          Compress-Archive -Path release/* -DestinationPath MatAiasu-Agent-Windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatAiasu-Agent-Windows
          path: MatAiasu-Agent-Windows.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MatAiasu-Agent-Windows.zip
          generate_release_notes: true
